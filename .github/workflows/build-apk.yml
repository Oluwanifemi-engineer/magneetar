name: Build Magneetar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (installs platform 34 + build tools, accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Verify SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" 2>&1
          ls "$ANDROID_HOME/build-tools/" 2>&1
          test -d "$ANDROID_HOME/platforms/android-34" && echo "OK: platform android-34 present" || echo "MISSING: platform android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0" && echo "OK: build-tools 34.0.0 present" || echo "MISSING: build-tools 34.0.0"

      - name: Inject real google-services.json (optional)
        # Placeholder is committed; if you set the GOOGLE_SERVICES_JSON
        # secret (base64 of your real android-app/app/google-services.json),
        # this replaces it so Firebase push actually works.
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android-app/app/google-services.json
            echo "::notice::Injected real google-services.json from secret"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — using placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build debug APK (unsigned, for sideloading)
        working-directory: android-app
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain -PSERVER_URL="$SERVER_URL" -PAPI_KEY="$API_KEY" \
            > "$GITHUB_WORKSPACE/gradle-build.log" 2>&1 || {
              echo "::error::Gradle build FAILED (exit $?) — what went wrong:"
              grep -A 20 "What went wrong:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
              grep -B2 -A 10 -E "Caused by:|Execution failed for task|FAILURE:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
              echo "::error::Full log saved to artifact on failure"
              exit 1
            }
          echo "::notice::Gradle build succeeded"
          tail -20 "$GITHUB_WORKSPACE/gradle-build.log"
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Upload build log (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magneetar-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
