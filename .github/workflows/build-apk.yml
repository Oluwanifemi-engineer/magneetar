name: Build Magneetar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build debug APK (unsigned, for sideloading)
        working-directory: android-app
        run: ./gradlew assembleDebug -PSERVER_URL="$SERVER_URL" -PAPI_KEY="$API_KEY"
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magneetar-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
