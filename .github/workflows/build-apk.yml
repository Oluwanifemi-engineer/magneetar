name: Build Magneetar APK

on:
  push:
    branches: [ main ]
  # Release events also build the signed APK (the old ci.yml build-android
  # job that did this with an UNSIGNED debug APK was removed — F-05).
  release:
    types: [ published ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (installs platform 36 + build tools, accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" 2>&1
          ls "$ANDROID_HOME/build-tools/" 2>&1
          test -d "$ANDROID_HOME/platforms/android-36" && echo "OK: platform android-36 present" || echo "MISSING: platform android-36 (compileSdk 36 required by AGP 8.10)"
          test -d "$ANDROID_HOME/build-tools/36.0.0" && echo "OK: build-tools 36.0.0 present" || echo "MISSING: build-tools 36.0.0"

      - name: Inject real google-services.json (optional)
        # Placeholder is committed; if you set the GOOGLE_SERVICES_JSON
        # secret (base64 of your real android-app/app/google-services.json),
        # this replaces it so Firebase push actually works.
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android-app/app/google-services.json
            echo "::notice::Injected real google-services.json from secret"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — using placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Restore release signing keystore from secret
        # The release keystore NEVER lives in the repo (gitignored). CI
        # receives it as base64 from the KEYSTORE_BASE64 secret and writes it
        # where gradle expects it (android-app/release.keystore).
        #
        # Resilience: on a plain PUSH the keystore secrets may not be
        # configured yet — instead of hard-failing every push, build a DEBUG
        # APK (still a full compile + unit-test gate; never published). On a
        # RELEASE event or manual workflow_dispatch a signed APK is the whole
        # point, so those still hard-fail if the secrets are missing.
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-app/release.keystore
            echo "::notice::Restored release keystore ($(stat -c%s android-app/release.keystore) bytes)"
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — release signing unavailable."
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "::error::KEYSTORE_BASE64 secret not set — a release build cannot be signed."
              echo "::error::Generate a keystore, add it as KEYSTORE_BASE64 plus KEYSTORE_PASS / KEY_ALIAS / KEY_ALIAS_PASS secrets."
              exit 1
            fi
            echo "::warning::Push event — building a DEBUG APK instead (compile + unit-test gate only; not published)."
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build APK (signed release when keystore configured, else debug)
        working-directory: android-app
        shell: bash
        run: |
          if [ "${RELEASE_SIGNING_AVAILABLE:-true}" = "true" ]; then
            # DEVICE_KEY (NOT the master API_KEY!) — the APK must embed only
            # the low-privilege device key. Baking MT_API_KEY into the APK
            # would hand dashboard-admin to anyone who downloads it.
            # bundleRelease produces the Play Store AAB (new apps must upload
            # AAB, not raw APKs); assembleRelease keeps the sideload APK.
            ./gradlew assembleRelease bundleRelease --stacktrace --console=plain \
              -PSERVER_URL="$SERVER_URL" -PDEVICE_KEY="$DEVICE_KEY" \
              -PKEYSTORE_PASS="$KEYSTORE_PASS" -PKEY_ALIAS="$KEY_ALIAS" -PKEY_ALIAS_PASS="$KEY_ALIAS_PASS" \
              > "$GITHUB_WORKSPACE/gradle-build.log" 2>&1 || {
                echo "::error::Gradle release build FAILED (exit $?) — what went wrong:"
                grep -A 20 "What went wrong:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
                grep -B2 -A 10 -E "Caused by:|Execution failed for task|FAILURE:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
                echo "::error::Full log saved to artifact on failure"
                exit 1
              }
            echo "::notice::Gradle release build succeeded (APK + Play AAB)"
          else
            # No keystore secrets on a push: build the DEBUG variant — still a
            # full Kotlin compile + unit-test gate, artifact for testing only.
            ./gradlew assembleDebug --stacktrace --console=plain \
              -PSERVER_URL="$SERVER_URL" -PDEVICE_KEY="$DEVICE_KEY" \
              > "$GITHUB_WORKSPACE/gradle-build.log" 2>&1 || {
                echo "::error::Gradle debug build FAILED (exit $?) — what went wrong:"
                grep -A 20 "What went wrong:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
                grep -B2 -A 10 -E "Caused by:|Execution failed for task|FAILURE:" "$GITHUB_WORKSPACE/gradle-build.log" | sed 's/^/::error::  /' || true
                echo "::error::Full log saved to artifact on failure"
                exit 1
              }
            echo "::notice::Gradle DEBUG build succeeded (keystore secrets not configured on push)"
          fi
          tail -5 "$GITHUB_WORKSPACE/gradle-build.log"
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          # GitHub secret DEVICE_KEY = server MT_DEVICE_KEY (low privilege).
          # Add it in repo Settings → Secrets — it must NOT be the master key.
          DEVICE_KEY: ${{ secrets.DEVICE_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASS: ${{ secrets.KEY_ALIAS_PASS }}

      - name: Verify APK signature with apksigner
        # A release APK that does not verify against the release keystore is
        # worthless (and dangerous) to ship — fail the build if the signature
        # does not validate or the certificate is missing. Debug APKs verify
        # against the Android debug key (fine — they are test artifacts only).
        #
        # NOTE: the APK lookup uses `find`, NOT `ls "{release,debug}"/*.apk`.
        # GitHub's step shell runs `bash -e -o pipefail`, and `ls` exits 2
        # when one of the directories (e.g. release/ on a debug-only build)
        # does not exist — pipefail then propagates that exit code through
        # `| head -1`, and `set -e` aborts the step before the signature
        # check ever runs. This failed the job with a bare "exit code 2".
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE"/android-app/app/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced — expected one in app/build/outputs/apk/release/ or .../debug/"
            exit 1
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo "::error::apksigner not found at $ANDROID_HOME/build-tools/36.0.0/apksigner"
            ls "$ANDROID_HOME/build-tools/" 2>&1 || true
            exit 1
          fi
          echo "Verifying: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          echo "::notice::APK signature verified"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

      - name: Upload build log (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magneetar-apk
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          # A debug-only push legitimately has no release/*.apk — never fail
          # the job over a missing artifact (the signature check already
          # verified the APK that exists).
          if-no-files-found: warn

      - name: Upload Play AAB artifact (release builds only)
        uses: actions/upload-artifact@v4
        with:
          name: Magneetar-aab
          path: android-app/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn
