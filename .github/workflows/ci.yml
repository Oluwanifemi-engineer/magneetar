# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — CI/CD Pipeline
# Runs tests, builds dashboard, publishes Docker images
# ═══════════════════════════════════════════════════════════════════════════════

name: Magneetar CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # Manual trigger for the live alert smoke test (sends real WhatsApp/SMS)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (full suite incl. live WebSocket integration tests)
        run: |
          cd server
          python -m pytest tests/ -v --tb=short

      - name: Run linting (flake8)
        # Uses the repo-root .flake8 config (auto-discovered by walking up from
        # server/). Full check — F401/E501/B008 etc. — matching local pre-commit.
        # Tool versions pinned in requirements-dev.txt (same env as pre-commit).
        # BLOCKING on purpose: a lint regression fails CI, not just logs.
        run: |
          cd server
          flake8 . --count --statistics

      - name: Dead code check (vulture)
        run: |
          cd server
          vulture . --min-confidence 70 --exclude 'venv/*,tests/*'
        continue-on-error: true

  # ── Alert Credential Check (free, read-only, non-blocking) ───────────────
  # Verifies stored Twilio credentials still authenticate against the real API.
  # No messages are sent and no charges incurred. Runs on every push/PR;
  # continue-on-error keeps the pipeline green if secrets aren't configured yet.
  alert-credential-check:
    name: Alert Credential Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Twilio credentials (read-only API auth check)
        run: |
          python3 scripts/twilio-config-check.py
        env:
          MT_TWILIO_SID: ${{ secrets.MT_TWILIO_SID }}
          MT_TWILIO_AUTH_TOKEN: ${{ secrets.MT_TWILIO_AUTH_TOKEN }}
          MT_TWILIO_SMS_FROM: ${{ secrets.MT_TWILIO_SMS_FROM }}
          MT_TWILIO_WHATSAPP_FROM: ${{ secrets.MT_TWILIO_WHATSAPP_FROM }}
          MT_ALERT_PHONE: ${{ secrets.MT_ALERT_PHONE }}
        continue-on-error: true

  # ── Live Alert Smoke Test (manual — sends ONE real WhatsApp + SMS) ───────
  # Triggered from the Actions tab (workflow_dispatch). Confirms end-to-end
  # delivery against real Twilio — credentials, numbers, and carrier routing.
  alert-smoke-test:
    name: Alert Smoke Test (live)
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send real WhatsApp + SMS smoke alert
        run: |
          python3 scripts/alert-smoke-test.py
        env:
          MT_TWILIO_SID: ${{ secrets.MT_TWILIO_SID }}
          MT_TWILIO_AUTH_TOKEN: ${{ secrets.MT_TWILIO_AUTH_TOKEN }}
          MT_TWILIO_SMS_FROM: ${{ secrets.MT_TWILIO_SMS_FROM }}
          MT_TWILIO_WHATSAPP_FROM: ${{ secrets.MT_TWILIO_WHATSAPP_FROM }}
          MT_ALERT_PHONE: ${{ secrets.MT_ALERT_PHONE }}

  # ── Dashboard Test ─────────────────────────────────────────────────────────
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Type check
        run: |
          cd dashboard
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd dashboard
          npm run test:ci

  # ── Dashboard Build ────────────────────────────────────────────────────────
  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    needs: [test-dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build
        run: |
          cd dashboard
          npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-static
          path: dashboard/out/

  # ── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-dashboard]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      actions: write  # required for type=gha cache backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (docker-container driver, required for gha cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}-server
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}-dashboard
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Android Build ─────────────────────────────────────────────────────────
  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK (installs platform 34 + build tools, accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug, for sideloading)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -PSERVER_URL="$SERVER_URL" -PAPI_KEY="$API_KEY"
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magneetar-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
