# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — CI/CD Pipeline
# Runs tests, builds dashboard, publishes Docker images
# ═══════════════════════════════════════════════════════════════════════════════

name: Magneetar CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # Manual trigger for the live alert smoke test (sends real WhatsApp/SMS)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (full suite incl. live WebSocket integration tests)
        run: |
          cd server
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log

      - name: Surface pytest failure details (diagnostic annotations)
        # CI logs require auth, but annotations are public via the check-runs
        # API. On failure, emit the tail of the pytest log as ::error:: so the
        # exact failing test/traceback is visible without admin access.
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import pathlib
          try:
              text = pathlib.Path('/tmp/pytest.log').read_text(errors='replace')
          except FileNotFoundError:
              print('::error::pytest log not found')
              raise SystemExit(0)
          lines = text.splitlines()
          # Keep failing-test context: any FAILED/ERROR lines + last 60 lines.
          keep = [l for l in lines if any(k in l for k in ('FAILED', 'ERROR', 'Error', 'assert', 'Exception'))][-40:]
          tail = lines[-60:]
          merged = keep + ['---tail---'] + tail
          msg = '\n'.join(merged[-90:])
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=server/tests::CI pytest failure:{msg[:60000]}')
          PYEOF

      - name: Run linting (flake8)
        # Uses the repo-root .flake8 config (auto-discovered by walking up from
        # server/). Full check — F401/E501/B008 etc. — matching local pre-commit.
        # Tool versions pinned in requirements-dev.txt (same env as pre-commit).
        # BLOCKING on purpose: a lint regression fails CI, not just logs.
        run: |
          cd server
          flake8 . --count --statistics

      - name: Dead code check (vulture)
        run: |
          cd server
          vulture . --min-confidence 70 --exclude 'venv/*,tests/*'
        continue-on-error: true

  # ── Alert Credential Check (free, read-only, non-blocking) ───────────────
  # Verifies stored Twilio credentials still authenticate against the real API.
  # No messages are sent and no charges incurred. Runs on every push/PR;
  # continue-on-error keeps the pipeline green if secrets aren't configured yet.
  alert-credential-check:
    name: Alert Credential Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Twilio credentials (read-only API auth check)
        run: |
          python3 scripts/twilio-config-check.py
        env:
          MT_TWILIO_SID: ${{ secrets.MT_TWILIO_SID }}
          MT_TWILIO_AUTH_TOKEN: ${{ secrets.MT_TWILIO_AUTH_TOKEN }}
          MT_TWILIO_SMS_FROM: ${{ secrets.MT_TWILIO_SMS_FROM }}
          MT_TWILIO_WHATSAPP_FROM: ${{ secrets.MT_TWILIO_WHATSAPP_FROM }}
          MT_ALERT_PHONE: ${{ secrets.MT_ALERT_PHONE }}
        continue-on-error: true

  # ── Live Alert Smoke Test (manual — sends ONE real WhatsApp + SMS) ───────
  # Triggered from the Actions tab (workflow_dispatch). Confirms end-to-end
  # delivery against real Twilio — credentials, numbers, and carrier routing.
  alert-smoke-test:
    name: Alert Smoke Test (live)
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send real WhatsApp + SMS smoke alert
        run: |
          python3 scripts/alert-smoke-test.py
        env:
          MT_TWILIO_SID: ${{ secrets.MT_TWILIO_SID }}
          MT_TWILIO_AUTH_TOKEN: ${{ secrets.MT_TWILIO_AUTH_TOKEN }}
          MT_TWILIO_SMS_FROM: ${{ secrets.MT_TWILIO_SMS_FROM }}
          MT_TWILIO_WHATSAPP_FROM: ${{ secrets.MT_TWILIO_WHATSAPP_FROM }}
          MT_ALERT_PHONE: ${{ secrets.MT_ALERT_PHONE }}

  # ── Backup/Restore Smoke Test ──────────────────────────────────────────────
  # Verifies the SQLite online-backup mechanism that scripts/backup-db.sh
  # relies on: snapshot a temp DB with seeded data, restore it, and check
  # integrity + data survived. Catches regressions in the backup path without
  # needing the production Docker stack.
  test-backup:
    name: Backup/Restore Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backup/restore smoke test
        run: |
          bash scripts/test-backup-smoke.sh

      - name: Shellcheck backup scripts
        # Runners don't ship shellcheck; use the same shellcheck-py the local
        # pre-commit gate uses (mirrors scripts/*.sh coverage in pre-commit).
        # NOTE: shellcheck-py installs the `shellcheck` BINARY — `python -m
        # shellcheck` does not exist (ModuleNotFoundError) and failed this job.
        run: |
          pip install shellcheck-py
          shellcheck scripts/backup-db.sh scripts/test-backup-smoke.sh

  # ── Dashboard Test ─────────────────────────────────────────────────────────
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Type check
        run: |
          cd dashboard
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd dashboard
          npm run test:ci

  # ── Dashboard Build ────────────────────────────────────────────────────────
  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    needs: [test-dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build
        run: |
          cd dashboard
          npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-static
          path: dashboard/out/

  # ── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-dashboard]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      actions: write  # required for type=gha cache backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (docker-container driver, required for gha cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}-server
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}-dashboard
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Android Build ─────────────────────────────────────────────────────────
  # NOTE: The signed-release Android pipeline lives in build-apk.yml (restores
  # the keystore from KEYSTORE_BASE64, runs assembleRelease, verifies with
  # apksigner). It triggers on push to main + workflow_dispatch + release.
  # The old debug-only build-android job was removed (F-05): it produced an
  # unsigned, debuggable APK on every release event — a security liability,
  # not an artifact worth publishing.
