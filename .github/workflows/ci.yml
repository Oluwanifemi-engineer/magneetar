# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — CI/CD Pipeline
# Runs tests, builds dashboard, publishes Docker images
# ═══════════════════════════════════════════════════════════════════════════════

name: Magneetar CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Run tests (exclude slow WebSocket tests that block event loop)
        run: |
          cd server
          python -m pytest tests/ -v --tb=short -k "not slow"

      - name: Run linting (flake8)
        run: |
          cd server
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Dead code check (vulture)
        run: |
          cd server
          pip install vulture
          vulture . --min-confidence 70 --exclude 'venv/*,tests/*'
        continue-on-error: true

  # ── Dashboard Test ─────────────────────────────────────────────────────────
  test-dashboard:
    name: Dashboard Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Run tests
        run: |
          cd dashboard
          npm run test:ci

  # ── Dashboard Build ────────────────────────────────────────────────────────
  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    needs: [test-dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build
        run: |
          cd dashboard
          npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-static
          path: dashboard/out/

  # ── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-dashboard]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      actions: write  # required for type=gha cache backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}-server
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}-dashboard
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ── Android Build ─────────────────────────────────────────────────────────
  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK (installs platform 34 + build tools, accepts licenses)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug, for sideloading)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -PSERVER_URL="$SERVER_URL" -PAPI_KEY="$API_KEY"
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magneetar-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
