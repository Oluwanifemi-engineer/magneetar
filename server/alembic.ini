# Alembic Configuration — Magneetar
# Migrations are executed via: cd server && alembic upgrade head
# For initial setup after adding alembic: alembic stamp head
#
# Uses raw SQL migration files (not SQLAlchemy ORM).
# Each migration is a .sql file in alembic/versions/.

[alembic]
script_location = alembic
prepend_sys_path = .

# Points to PostgreSQL — SQLite is still managed by database.py's
# idempotent init_db() / ensure_initialized() (Phase 2b retirement
# is documented in docs/postgres-migration.md).
#
# Set MT_DATABASE_URL in server/.env or pass via CLI:
#   alembic -x database_url=postgresql://... upgrade head
sqlalchemy.url = %(DATABASE_URL)s

# Migration ordering and naming
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Run each migration in its own transaction (safer for raw SQL)
transaction_per_migration = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
