# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — Pre-Commit Hooks
# Enforces code quality on every commit
# ═══════════════════════════════════════════════════════════════════════════════

repos:

  # ─── Generic hooks ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ─── Python (server) ──────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: black (Python formatter)
        language_version: python3.14
        args: [--line-length=120]
        files: ^server/

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort (Python import sorter)
        args: [--profile=black, --line-length=120]
        files: ^server/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        name: flake8 (Python linter)
        # Config lives in the repo-root .flake8 file (auto-discovered by flake8
        # from the CWD). Do NOT put config in args here: YAML flow-style lists
        # split on commas, so `--extend-ignore=E203,W503,B008` would be parsed as
        # four separate args (W503/B008 treated as filenames → E902).
        files: ^server/
        additional_dependencies:
          - flake8-bugbear==25.11.29  # keep in sync with server/requirements-dev.txt

  # ─── Shell (scripts/) ────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (scripts)
        files: ^scripts/.*\.sh$

  # ─── JavaScript / TypeScript (dashboard) ─────────────────────────────────
  # Uses eslint with Next.js's config. TypeScript handling is managed
  # by eslint-config-next internally — no pinned @typescript-eslint deps
  # needed to avoid version drift between pre-commit and npm run lint.
  #
  # NOTE: When upgrading eslint to v9+ (flat config), update BOTH the
  # hook `rev` (v9.20.1 → v9.x.x) AND the additional_dependencies version
  # (8.57.1 → 9.x.x) in sync to avoid version mismatch.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.20.1
    hooks:
      - id: eslint
        name: eslint (dashboard)
        files: ^dashboard/src/.*\.(ts|tsx)$
        types: [file]
        args: [--fix, --config, dashboard/.eslintrc.json]
        additional_dependencies:
          - eslint@8.57.1
          - eslint-config-next@14.2.21

  # ─── TypeScript typecheck (dashboard) — local hook ────────────────────────
  # Mirrors the `npx tsc --noEmit` gate CI already runs (test-dashboard job),
  # giving the same type-safety check at commit time. Requires dashboard
  # node_modules (typescript). The guard gives a clear install hint instead of
  # npx silently offering to fetch a bogus `tsc` package.
  - repo: local
    hooks:
      - id: tsc
        name: tsc (dashboard typecheck)
        entry: >-
          bash -c 'test -x dashboard/node_modules/.bin/tsc ||
          { echo "TypeScript not installed — run: make dashboard-install"; exit 1; };
          cd dashboard && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^dashboard/.*\.(ts|tsx)$

  # ─── Version consistency (server/VERSION must match root VERSION) ────────
  # The release fold bumped the root VERSION but missed server/VERSION, so a
  # deployed 1.5.0 server reported "1.4.4" on /health. The app reads
  # server/VERSION (server/Dockerfile copies it; config.py reads it at
  # runtime); release scripts read the root one. Keep them in lockstep.
  - repo: local
    hooks:
      - id: version-consistency
        name: version-consistency (root vs server VERSION)
        entry: >-
          bash -c 'test -f VERSION && test -f server/VERSION || exit 0;
          if ! diff -q VERSION server/VERSION >/dev/null; then
          echo "VERSION ($(cat VERSION)) != server/VERSION ($(cat server/VERSION))";
          echo "Bump both together — the running server reads server/VERSION."; exit 1; fi'
        language: system
        pass_filenames: false
        files: ^(VERSION|server/VERSION)$

  # ─── Kotlin dead code detection (android-app) — local hook ──────────────
  # Checks for empty catch blocks, TODO/FIXME markers, commented-out code
  # blocks, and unused private functions. Warnings only — never blocks commits.
  - repo: local
    hooks:
      - id: kotlin-dead-code
        name: kotlin-dead-code (android-app)
        entry: scripts/check-kotlin-dead-code.sh
        language: script
        files: ^android-app/.*\.kt$
        pass_filenames: true
