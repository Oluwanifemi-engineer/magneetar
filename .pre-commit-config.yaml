# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — Pre-Commit Hooks
# Enforces code quality on every commit
# ═══════════════════════════════════════════════════════════════════════════════

repos:

  # ─── Generic hooks ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ─── Python (server) ──────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: black (Python formatter)
        language_version: python3.14
        args: [--line-length=120]
        files: ^server/

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort (Python import sorter)
        args: [--profile=black, --line-length=120]
        files: ^server/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        name: flake8 (Python linter)
        # Config lives in the repo-root .flake8 file (auto-discovered by flake8
        # from the CWD). Do NOT put config in args here: YAML flow-style lists
        # split on commas, so `--extend-ignore=E203,W503,B008` would be parsed as
        # four separate args (W503/B008 treated as filenames → E902).
        files: ^server/
        additional_dependencies:
          - flake8-bugbear

  # ─── JavaScript / TypeScript (dashboard) ─────────────────────────────────
  # Uses eslint with Next.js's config. TypeScript handling is managed
  # by eslint-config-next internally — no pinned @typescript-eslint deps
  # needed to avoid version drift between pre-commit and npm run lint.
  #
  # NOTE: When upgrading eslint to v9+ (flat config), update BOTH the
  # hook `rev` (v9.20.1 → v9.x.x) AND the additional_dependencies version
  # (8.57.1 → 9.x.x) in sync to avoid version mismatch.
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.20.1
    hooks:
      - id: eslint
        name: eslint (dashboard)
        files: ^dashboard/src/.*\.(ts|tsx)$
        types: [file]
        args: [--fix, --config, dashboard/.eslintrc.json]
        additional_dependencies:
          - eslint@8.57.1
          - eslint-config-next@14.2.21
