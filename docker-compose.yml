# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — Docker Compose
# Production deployment with PostgreSQL + server + dashboard
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: magneetar-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_DB: magneetar
      POSTGRES_USER: magneetar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magneetar -d magneetar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  # ── Backend API ────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.1.0"
    container_name: magneetar-server
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./server/.env
    environment:
      - MT_ENVIRONMENT=production
      # Use PostgreSQL in Docker.
      # NOTE: MT_DB_PASSWORD is interpolated from the ROOT .env (compose only
      # reads the project-root .env for ${} interpolation), and must stay in
      # sync with server/.env (which the container also loads via env_file).
      # If they drift, PostgreSQL auth silently fails and the server falls
      # back to SQLite — keep both files updated together (generate-env.sh).
      - MT_DATABASE_URL=postgresql://magneetar:${MT_DB_PASSWORD:-changeme}@db:5432/magneetar
    volumes:
      - magneetar-data:/app/data
      - ./server/static/apk:/app/static/apk
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Dashboard (production - served via Nginx) ──────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.magneetar.me
    container_name: magneetar-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: magneetar-tunnel
    restart: unless-stopped
    # Run as root so the container can read the host credentials file
    # (mode 0400, owned by the host user). cloudflared image is a minimal
    # scratch binary — no other processes run under this user.
    user: "0:0"
    # Locally-managed config file (repo versioned) — routes to Docker service
    # names (server / dashboard), fixing the 503 caused by localhost ingress
    # inside the container. Credentials file is a host secret, never committed.
    # NOTE: CF_TUNNEL_TOKEN in root .env is now DEPRECATED for this service —
    # the token-driven dashboard-managed ingress is no longer used. It is kept
    # in .env only for reference / rollback.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared/6c8892f6-598b-42cc-99c9-8350dd573671.json:/etc/cloudflared/credentials.json:ro
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - server
      - dashboard

secrets:
  db_password:
    file: ./server/.db_password

volumes:
  postgres-data:
  magneetar-data:
