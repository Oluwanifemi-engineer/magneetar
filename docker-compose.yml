# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — Docker Compose
# Production deployment with server + dashboard on a single data plane.
# ═══════════════════════════════════════════════════════════════════════════════
#
# DATABASE DECISION (v1.3.1): the app's data plane is SQLite at
# /app/data/magneetar.db (persisted volume), with WAL + the online-backup
# script (scripts/backup-db.sh). Every route reads/writes SQLite via
# database.py — PostgreSQL was a documented-optional path that held NO app
# data, and its adapter schema had drifted (missing users/fcm_tokens/error_log
# tables), so enabling MT_DATABASE_URL would break registration. It is removed
# from this stack to keep one honest, well-tested persistence layer.
#
# An optional PostgreSQL adapter (database_postgres.py) still exists in the
# codebase for future scale-out; the server logs a clear warning if you opt in.

services:

  # ── Backend API ────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.4.3"
    container_name: magneetar-server
    restart: unless-stopped
    depends_on:
      redis:
        # Wait for the pub/sub bus to be HEALTHY, not just started — the
        # server's broadcast listener subscribes at boot and messages
        # published before the first subscribe would be lost.
        condition: service_healthy
    ports:
      - "8002:8000"
    env_file:
      - ./server/.env
    environment:
      - MT_ENVIRONMENT=production
      # SQLite must live on the persisted volume (/app/data), NOT the container
      # layer (/app). A relative path resolves against WORKDIR=/app, so every
      # rebuild silently wiped accounts + device registrations. /app/data is the
      # magneetar-data volume, so data now survives rebuilds.
      - MT_DB_PATH=/app/data/magneetar.db
      # Media files (evidence photos/audio/video) on the persisted media volume
      # (v1.4 media refactor — bytes no longer live in the SQLite file).
      - MT_MEDIA_DIR=/app/media
      # Multi-worker realtime: Redis pub/sub keeps WebSocket broadcasts
      # consistent across the 4 uvicorn workers (see websocket_manager.py).
      - MT_REDIS_URL=redis://redis:6379/0
      # Live dashboards per worker (4 workers => up to ~1,000 total).
      - MT_MAX_WS_CONNECTIONS=250
      # Batch telemetry writes into ~250ms commits (removes SQLite's
      # single-writer lock from the request path — lifts the ~370 req/s
      # sync-commit ceiling 5-10x). 0/absent = synchronous commits.
      - MT_WRITE_BATCH_MS=250
    volumes:
      - magneetar-data:/app/data
      - magneetar-media:/app/media
      - ./server/static/apk:/app/static/apk
      # Firebase service-account JSON for FCM push alerts. server/.env sets
      # MT_FIREBASE_KEY=./firebase-key.json, which (WORKDIR=/app) resolves to
      # the container path /app/firebase-key.json — so the REAL gitignored
      # service-account key must be mounted there. (Previously the mount used a
      # different filename, so FCM push silently never initialized in prod.)
      - ./server/firebase-key.json:/app/firebase-key.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Dashboard (production - served via Nginx) ──────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.magneetar.me
        # Landing-page fallback version badge — deploy.sh exports this from the
        # repo VERSION file so the static fallback never drifts from the release.
        - NEXT_PUBLIC_APP_VERSION=${MT_APP_VERSION:-1.4.1}
    container_name: magneetar-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  # ── Realtime Broadcast Bus (multi-worker WebSocket fan-out) ────────────────
  redis:
    image: redis:7-alpine
    container_name: magneetar-redis
    restart: unless-stopped
    # Pub/sub only — nothing to persist. Bounded memory keeps it tiny.
    command:
      ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: magneetar-tunnel
    restart: unless-stopped
    # Run as root so the container can read the host credentials file
    # (mode 0400, owned by the host user). cloudflared image is a minimal
    # scratch binary — no other processes run under this user.
    user: "0:0"
    # Locally-managed config file (repo versioned) — routes to Docker service
    # names (server / dashboard), fixing the 503 caused by localhost ingress
    # inside the container. Credentials file is a host secret, never committed.
    # NOTE: CF_TUNNEL_TOKEN is DEPRECATED for this service — the token-driven
    # dashboard-managed ingress is no longer used. If it is ever needed again,
    # the value lives in server/.env (the root .env duplicate was removed).
    # --edge-ip-version 4: the host has no IPv6 route; without this,
    # cloudflared keeps dialing IPv6 edge addresses, dropping the connection
    # and canceling in-flight streams (pages hang / "connection closed").
    command: tunnel --no-autoupdate --edge-ip-version 4 --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared/6c8892f6-598b-42cc-99c9-8350dd573671.json:/etc/cloudflared/credentials.json:ro
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - server
      - dashboard

volumes:
  magneetar-data:
  magneetar-media:
