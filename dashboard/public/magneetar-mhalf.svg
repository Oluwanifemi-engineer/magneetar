<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Magneetar Logo - Tall rounded shape with "I" bar inside -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#000000"/>

  <!-- Main rounded vertical shape (plug/key slot) -->
  <rect x="192" y="80" width="128" height="352" rx="64" ry="64" fill="#ffffff"/>

  <!-- Inner "I" bar cutout -->
  <rect x="232" y="180" width="48" height="152" rx="8" ry="8" fill="#000000"/>
</svg>
