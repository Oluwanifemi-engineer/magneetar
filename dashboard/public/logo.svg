<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F85AAE"/>
      <stop offset="50%" stop-color="#E91E8C"/>
      <stop offset="100%" stop-color="#8B0A5E"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3D3E6"/>
    </linearGradient>
  </defs>

  <!-- Magenta M tile with bold solid M -->
  <rect x="4" y="8" width="48" height="48" rx="12" fill="url(#lg-bg)"/>
  <rect x="4" y="8" width="48" height="48" rx="12" fill="url(#lg-glow)"/>
  <path d="M12.2 46 L12.2 21 L26 42 L39.8 21 L39.8 46"
        stroke="url(#lg-m)" stroke-width="6.6"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="66" y="30"
        font-family="'Inter','SF Pro',system-ui,sans-serif"
        font-size="23" font-weight="800" fill="#FFFFFF"
        letter-spacing="5">MAGNEETAR</text>
  <rect x="66" y="37" width="28" height="2" rx="1" fill="#E91E8C" opacity="0.85"/>
  <text x="66" y="50"
        font-family="'JetBrains Mono','SF Mono',monospace"
        font-size="8" fill="#FFFFFF"
        letter-spacing="3" opacity="0.4">TRACK · PROTECT · RECOVER</text>
</svg>
