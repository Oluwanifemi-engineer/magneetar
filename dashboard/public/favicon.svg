<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black background -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  
  <!-- S+M Icon — scaled to fit 64x64 -->
  <g transform="translate(8, 8) scale(0.42)" filter="url(#glow)">
    <path 
      d="M 16 48
         C 2 36, 2 10, 26 2
         C 44 -4, 52 10, 36 20
         C 20 30, 8 36, 16 26
         Q 28 20, 40 26
         L 54 2
         L 68 26
         L 82 2
         L 96 26"
      fill="none"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
