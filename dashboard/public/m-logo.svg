<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F03A9E"/>
      <stop offset="45%" stop-color="#E91E8C"/>
      <stop offset="100%" stop-color="#8B0A5E"/>
    </linearGradient>
    <radialGradient id="mg-glow" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Magenta tile (the dashboard/login aurora colour) -->
  <rect width="120" height="120" rx="26" fill="url(#mg-bg)"/>
  <rect width="120" height="120" rx="26" fill="url(#mg-glow)"/>

  <!-- Hairline inner ring -->
  <rect x="5.5" y="5.5" width="109" height="109" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Capital M — white -->
  <path d="M24 88 L24 32 L48 60 L60 44 L72 60 L96 32 L96 88"
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
