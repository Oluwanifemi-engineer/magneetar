# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR DASHBOARD — Nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.magneetar.me https://magneetar.me https: wss:; media-src 'self' data: blob:;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets with cache
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA routing — static export produces per-page .html files (login.html,
    # signup.html, dashboard.html, privacy.html), so try $uri.html before
    # falling back to index.html. This makes /login, /signup, /dashboard and
    # /privacy resolve to their real pages on direct URL hits.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
