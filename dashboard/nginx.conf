# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR DASHBOARD — Nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # Hide nginx version in error pages / Server header (F-09)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — snippet must ALSO be included inside every location
    # that sets its own add_header (nginx replaces, not merges). See
    # security-headers.conf for the explanation.
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets with cache
    location /_next/static {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA routing — static export produces per-page .html files (login.html,
    # signup.html, dashboard.html, privacy.html), so try $uri.html before
    # falling back to index.html. This makes /login, /signup, /dashboard and
    # /privacy resolve to their real pages on direct URL hits.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # .well-known/ is a standard, public metadata directory (security.txt,
    # apple-app-site-association...) — MUST be served before the hidden-file
    # rule below, which would otherwise 403 it.
    location ^~ /.well-known/ {
        include /etc/nginx/conf.d/security-headers.conf;
        allow all;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Deny access to hidden files (except .well-known handled above)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
