# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR DASHBOARD — Security Headers Snippet
# ───────────────────────────────────────────────────────────────────────────────
# IMPORTANT (nginx semantics): an `add_header` directive inside a `location`
# block REPLACES (does not merge with) the `add_header` directives inherited
# from the enclosing `server` block. Every content-serving location below sets
# its own Cache-Control via `add_header`, so this snippet must be `include`d in
# each of those locations — otherwise the security headers silently vanish from
# responses served by that location. (Verified in production: server-level
# headers alone produced zero security headers on index.html.)
# ═══════════════════════════════════════════════════════════════════════════════

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), fullscreen=(self)" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.magneetar.me https://magneetar.me wss://api.magneetar.me; media-src 'self' data: blob:; frame-ancestors 'none';" always;
